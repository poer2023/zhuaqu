<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZhaQu</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="popup">
        <header class="popup-header">
            <div class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="9" y1="9" x2="15" y2="15"></line>
                    <line x1="15" y1="9" x2="9" y2="15"></line>
                </svg>
                <span>ZhaQu</span>
            </div>
            <div class="status-indicator" id="status-indicator"></div>
        </header>

        <main class="popup-content">
            <div class="section">
                <div class="section-title">Quick Actions</div>
                <button class="action-btn primary" id="toggle-mode-btn">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="22 12 16 12 14 15 10 15 8 12 2 12"></polyline>
                        <path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path>
                    </svg>
                    Enable Selection Mode
                </button>
            </div>

            <div class="section">
                <div class="section-title">Connection</div>
                <div class="connection-status" id="connection-status">
                    <span class="dot"></span>
                    <span class="text">Checking...</span>
                </div>
                <div class="input-group">
                    <input type="text" id="api-base" placeholder="Backend URL" value="http://localhost:3000">
                    <button class="btn-small" id="save-url-btn">Save</button>
                </div>
            </div>

            <div class="section">
                <div class="section-title">Instructions</div>
                <ol class="instructions">
                    <li>Click "Enable Selection Mode" on X/Twitter</li>
                    <li>Click checkboxes on tweets you want to collect</li>
                    <li>Select target pool and click "Import"</li>
                </ol>
            </div>
        </main>

        <footer class="popup-footer">
            <a href="http://localhost:3000" target="_blank">Open Dashboard →</a>
        </footer>
    </div>

    <script src="popup.js"></script>
</body>
</html>
