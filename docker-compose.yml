# Zhaqu Docker Compose 配置 (Coolify 简化版)
# web 容器同时运行前端和 worker

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zhaqu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zhaqu_password}
      POSTGRES_DB: ${POSTGRES_DB:-zhaqu}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zhaqu} -d ${POSTGRES_DB:-zhaqu}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-zhaqu}:${POSTGRES_PASSWORD:-zhaqu_password}@postgres:5432/${POSTGRES_DB:-zhaqu}?schema=public
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3344}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-default-secret-change-me}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - MEDIA_DIR=/app/data/media
      - WORKER_ROLE=all
    volumes:
      - media_data:/app/data/media
    ports:
      - "3344:3000"
    # 使用 scripts/start.sh 同时启动 web 和 worker

volumes:
  postgres_data:
  media_data:
