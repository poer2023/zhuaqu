# Zhaqu Docker Compose 配置
# 使用方式: docker compose up -d

services:
  # ==================== PostgreSQL 数据库 ====================
  postgres:
    image: postgres:16-alpine
    container_name: zhaqu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zhaqu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zhaqu_password}
      POSTGRES_DB: ${POSTGRES_DB:-zhaqu}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zhaqu} -d ${POSTGRES_DB:-zhaqu}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Next.js Web 服务 ====================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zhaqu-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-zhaqu}:${POSTGRES_PASSWORD:-zhaqu_password}@postgres:5432/${POSTGRES_DB:-zhaqu}?schema=public
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - MEDIA_DIR=/app/data/media
      - YTDLP_COOKIES=${YTDLP_COOKIES}
      - YTDLP_PROXY=${YTDLP_PROXY}
      - PUBLISH_HEADLESS=${PUBLISH_HEADLESS:-true}
      - X_USER_AGENT=${X_USER_AGENT}
    volumes:
      - media_data:/app/data/media
      - playwright_cache:/root/.cache/ms-playwright
    ports:
      - "${WEB_PORT:-3344}:3000"
    command: >
      sh -c "npx prisma migrate deploy && node server.js"

  # ==================== Worker 服务 ====================
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zhaqu-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_started
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-zhaqu}:${POSTGRES_PASSWORD:-zhaqu_password}@postgres:5432/${POSTGRES_DB:-zhaqu}?schema=public
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - MEDIA_DIR=/app/data/media
      - YTDLP_COOKIES=${YTDLP_COOKIES}
      - YTDLP_PROXY=${YTDLP_PROXY}
      - PUBLISH_HEADLESS=${PUBLISH_HEADLESS:-true}
      - X_USER_AGENT=${X_USER_AGENT}
      - WORKER_POLL_INTERVAL_MS=${WORKER_POLL_INTERVAL_MS:-2000}
      - WORKER_ROLE=${WORKER_ROLE:-all}
    volumes:
      - media_data:/app/data/media
      - playwright_cache:/root/.cache/ms-playwright
    command: npx tsx scripts/worker.ts

  # ==================== Watchdog 服务 ====================
  watchdog:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zhaqu-watchdog
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_started
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-zhaqu}:${POSTGRES_PASSWORD:-zhaqu_password}@postgres:5432/${POSTGRES_DB:-zhaqu}?schema=public
      - WATCHDOG_INTERVAL_MS=${WATCHDOG_INTERVAL_MS:-30000}
    command: npx tsx scripts/watchdog.ts

volumes:
  postgres_data:
    driver: local
  media_data:
    driver: local
  playwright_cache:
    driver: local

networks:
  default:
    name: zhaqu-network

